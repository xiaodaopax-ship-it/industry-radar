name: build-dashboard

# Manual only (the weekly schedule was removed and the workflow is disabled in the repo settings).
# This is a PUBLIC repository: an uploaded dashboard artifact would redistribute third-party data (Yahoo Finance),
# and Yahoo answers GitHub-hosted runners with HTTP 429 anyway (probe 2026-10-27). The weekly refresh runs on the
# owner's machine and publishes only to a private location.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}   # e.g. "industry-radar you@yourmail.com"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore SEC / Yahoo cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: radar-cache-${{ github.run_id }}
          restore-keys: radar-cache-
      - name: Fetch data and build dashboard
        run: python -m radar fetch
      - name: Build Intel deep-dive example
        run: python deep-dive/intel/build.py
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: site/
          retention-days: 14
